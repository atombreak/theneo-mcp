name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Changes in ${{ github.ref_name }}
            
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
            
            ### Installation
            
            ```bash
            npm install -g theneo-mcp@${{ steps.get_version.outputs.VERSION }}
            ```
            
            Or via Homebrew:
            
            ```bash
            brew upgrade theneo-mcp
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: publish
    
    steps:
      - name: Wait for npm package to be available
        run: sleep 60

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Fetch npm package tarball
        id: fetch_tarball
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          URL="https://registry.npmjs.org/theneo-mcp/-/theneo-mcp-${VERSION}.tgz"
          wget -q "$URL" -O package.tgz
          SHA256=$(shasum -a 256 package.tgz | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: theneo/homebrew-theneo-mcp
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          cd homebrew-tap
          cat > Formula/theneo-mcp.rb << 'EOF'
          class TheneoMcp < Formula
            desc "MCP server for Theneo SDK - API documentation automation"
            homepage "https://github.com/theneo/theneo-mcp"
            url "${{ steps.fetch_tarball.outputs.url }}"
            sha256 "${{ steps.fetch_tarball.outputs.sha256 }}"
            license "MIT"

            depends_on "node"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end

            test do
              system "#{bin}/theneo-mcp", "--version"
            end
          end
          EOF

      - name: Commit and push changes
        run: |
          cd homebrew-tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/theneo-mcp.rb
          git commit -m "Update theneo-mcp to ${{ steps.get_version.outputs.VERSION }}"
          git push

